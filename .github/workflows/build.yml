name: Core CI

on:
  push:
    branches:
      - main
      - patch-4
  pull_request:
    branches:
      - main
      - patch-4
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:testDebugUnitTest :player-core:testDebugUnitTest --stacktrace

      - name: Lint
        if: always()
        run: |
          ./gradlew :core:lintDebug :player-core:lintDebug --stacktrace

      - name: Compile instrumentation tests
        if: always()
        run: |
          chmod +x ./gradlew
          ./gradlew :core:assembleDebugAndroidTest :player-core:assembleDebugAndroidTest

      - name: Room schemas unchanged
        if: always()
        run: |
          if ! git diff --exit-code -- core/schemas; then
            echo "::error::A Room schema JSON changed. If this was intentional, bump the database version and add a migration; then commit the regenerated schema."
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            core/build/reports/tests/**
            core/build/reports/lint-results-*.html
            player-core/build/reports/tests/**
            player-core/build/reports/lint-results-*.html
          if-no-files-found: warn
