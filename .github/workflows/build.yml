name: Core CI

# Core is a library two apps depend on, so its gate is the build plus three things the apps can no
# longer check for it:
#   - the unit tests of both modules
#   - lint, with abortOnError = true in each module's build file
#   - the Room schema JSONs, which must not change unless a migration was intended
#
# Instrumentation tests are compiled, never run: there is no device here, and running them on a real
# TV wipes its data.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply AudioMix Core patch
        shell: python
        run: |
          from pathlib import Path

          player = Path('player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt')
          s = player.read_text()
          if 'private val _audioMixEnabled' not in s:
              marker = 'private var audioDelaySec = 0.0'
              if marker not in s: raise SystemExit('audio delay marker not found')
              fields = '''private val _audioMixEnabled = MutableStateFlow(false)
    val audioMixEnabled: StateFlow<Boolean> = _audioMixEnabled.asStateFlow()
    private var audioMixOriginalAid: Int? = null
    private var audioMixExternalAid: Int? = null

    '''
              s = s.replace(marker, fields + marker, 1)
          if 'fun audioMixEnable(' not in s:
              marker = '    fun selectAudio(mpvId: Int) {'
              if marker not in s: raise SystemExit('selectAudio marker not found')
              methods = '''    fun audioMixEnable(url: String, headers: String? = null, userAgent: String? = null) {
        if (url.isBlank()) return
        mpvAsync {
            if (exoActive || !initialized) return@mpvAsync
            if (_audioMixEnabled.value) audioMixDisableInternal()
            val originalAid = getPropertyInt("aid")
            val originalHeaders = getPropertyString("http-header-fields") ?: ""
            val originalUserAgent = getPropertyString("user-agent") ?: ""
            val countBefore = getPropertyInt("track-list/count") ?: 0
            val idsBefore = (0 until countBefore).mapNotNull { getPropertyInt("track-list/$it/id") }.toSet()
            audioMixOriginalAid = originalAid
            if (headers != null) setPropertyString("http-header-fields", headers)
            if (!userAgent.isNullOrBlank()) setPropertyString("user-agent", userAgent)
            try {
                command(arrayOf("audio-add", url, "select", "AudioMix", ""))
                var externalId: Int? = null
                repeat(50) {
                    delay(100)
                    val count = getPropertyInt("track-list/count") ?: 0
                    for (i in 0 until count) {
                        if (getPropertyString("track-list/$i/type") != "audio") continue
                        val id = getPropertyInt("track-list/$i/id") ?: continue
                        val external = getPropertyBoolean("track-list/$i/external") ?: false
                        if (external && id !in idsBefore) { externalId = id; break }
                    }
                    if (externalId != null) return@repeat
                }
                val id = externalId ?: return@mpvAsync
                audioMixExternalAid = id
                setPropertyInt("aid", id)
                _audioMixEnabled.value = true
            } finally {
                setPropertyString("http-header-fields", originalHeaders)
                setPropertyString("user-agent", originalUserAgent)
            }
        }
    }

    fun audioMixDisable() { mpvAsync { audioMixDisableInternal() } }

    private fun audioMixDisableInternal() {
        if (!initialized) return
        audioMixExternalAid?.let { command(arrayOf("audio-remove", it.toString())) }
        if (audioMixOriginalAid != null) setPropertyInt("aid", audioMixOriginalAid!!)
        else setPropertyString("aid", "no")
        audioMixExternalAid = null
        audioMixOriginalAid = null
        _audioMixEnabled.value = false
    }

'''
              s = s.replace(marker, methods + marker, 1)
          s = s.replace('coerceIn(-5_000, 5_000)', 'coerceIn(-10_000, 10_000)')
          player.write_text(s)

          engine = Path('player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt')
          s = engine.read_text()
          if 'val audioMixEnabled: StateFlow<Boolean>' not in s:
              marker = '    fun selectAudio(id: Int)'
              if marker not in s: raise SystemExit('PlaybackEngine selectAudio marker not found')
              api = '''    val audioMixEnabled: StateFlow<Boolean> get() = FALSE_FLOW
    fun audioMixEnable(url: String, headers: String? = null, userAgent: String? = null) {}
    fun audioMixDisable() {}
'''
              s = s.replace(marker, api + marker, 1)
          if 'override val audioMixEnabled' not in s:
              marker = '    override fun selectAudio(id: Int) = p.selectAudio(id)'
              if marker not in s: raise SystemExit('MpvPlaybackEngine selectAudio marker not found')
              delegate = '''    override val audioMixEnabled get() = p.audioMixEnabled
    override fun audioMixEnable(url: String, headers: String?, userAgent: String?) = p.audioMixEnable(url, headers, userAgent)
    override fun audioMixDisable() = p.audioMixDisable()
'''
              s = s.replace(marker, delegate + marker, 1)
          engine.write_text(s)

      - name: Commit AudioMix Core patch
        run: |
          if git diff --quiet -- player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt; then
            echo "AudioMix Core patch already present"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt
            git commit -m "Implement AudioMix in playback core"
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:testDebugUnitTest :player-core:testDebugUnitTest --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew :core:lintDebug :player-core:lintDebug --stacktrace

      - name: Compile instrumentation tests
        if: always()
        run: ./gradlew :core:assembleDebugAndroidTest :player-core:assembleDebugAndroidTest

      - name: Room schemas unchanged
        if: always()
        run: |
          if ! git diff --exit-code -- core/schemas; then
            echo "::error::A Room schema JSON changed."
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            core/build/reports/tests/**
            core/build/reports/lint-results-*.html
            player-core/build/reports/tests/**
            player-core/build/reports/lint-results-*.html
          if-no-files-found: warn
