name: Core CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply AudioMix Core patch
        run: python tools/apply_audiomix_patch.py

      - name: Verify AudioMix Core patch
        run: |
          grep -n "audioMixEnable\|audioMixDisable\|audioMixExternalAid" player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt
          grep -n "coerceIn(-10_000, 10_000)" player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Core
        run: |
          chmod +x ./gradlew
          ./gradlew :player-core:compileReleaseKotlin --no-daemon --stacktrace

      - name: Commit AudioMix Core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt
          if git diff --cached --quiet; then
            echo "AudioMix Core patch already committed"
          else
            git commit -m "Implement AudioMix in playback core"
            git push
          fi
