# one-time AudioMix source patch
name: Apply AudioMix Core Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply AudioMix Core Patch') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch OwnTVPlayer
        shell: python
        run: |
          from pathlib import Path
          p = Path('player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt')
          s = p.read_text()
          if 'fun audioMixEnable' not in s:
              marker = 'private var audioDelaySec = 0.0'
              if marker not in s: raise SystemExit('audio delay marker not found')
              fields = '''private var audioMixOriginalAid: Int? = null
    private var audioMixExternalAid: Int? = null
    private var audioMixEnabled = false
    private var audioMixHeaders: String? = null

    '''
              s = s.replace(marker, fields + marker, 1)
              marker2 = '    fun selectAudio(mpvId: Int) {'
              if marker2 not in s: raise SystemExit('selectAudio marker not found')
              methods = r'''    fun audioMixEnable(url: String, headers: String? = null) {
        if (url.isBlank()) return
        mpvAsync {
            val m = mpv ?: return@mpvAsync
            if (audioMixEnabled) audioMixDisableInternal()
            audioMixOriginalAid = m.getPropertyInt("aid")
            audioMixHeaders = headers
            headers?.takeIf { it.isNotBlank() }?.let { setPropertyString("http-header-fields", it) }
            command(arrayOf("audio-add", url, "select", "AudioMix", ""))
            var externalId: Int? = null
            repeat(40) {
                delay(100)
                val count = m.getPropertyInt("track-list/count") ?: 0
                for (i in 0 until count) {
                    if (m.getPropertyString("track-list/$i/type") != "audio") continue
                    val external = m.getPropertyBoolean("track-list/$i/external") ?: false
                    val filename = m.getPropertyString("track-list/$i/external-filename")
                    if (external && (filename == url || filename?.contains(url) == true)) {
                        externalId = m.getPropertyInt("track-list/$i/id")
                        break
                    }
                }
                if (externalId != null) return@repeat
            }
            val id = externalId ?: return@mpvAsync
            audioMixExternalAid = id
            audioMixEnabled = true
            setPropertyInt("aid", id)
            if (!headers.isNullOrBlank()) setPropertyString("http-header-fields", "")
        }
    }

    fun audioMixDisable() { mpvAsync { audioMixDisableInternal() } }

    private fun audioMixDisableInternal() {
        val m = mpv ?: return
        audioMixExternalAid?.let { command(arrayOf("audio-remove", it.toString())) }
        audioMixOriginalAid?.let { setPropertyInt("aid", it) }
        audioMixExternalAid = null
        audioMixOriginalAid = null
        audioMixEnabled = false
        audioMixHeaders = null
    }

    fun audioMixIsEnabled(): Boolean = audioMixEnabled

'''
              s = s.replace(marker2, methods + marker2, 1)
          p.write_text(s)
      - name: Patch PlaybackEngine API
        shell: python
        run: |
          from pathlib import Path
          p = Path('player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt')
          s = p.read_text()
          if 'fun audioMixEnable' not in s:
              marker = '    fun selectAudio(id: Int)'
              insert = '''    fun audioMixEnable(url: String, headers: String? = null) {}
    fun audioMixDisable() {}
    val audioMixEnabled: StateFlow<Boolean> get() = FALSE_FLOW

'''
              s = s.replace(marker, insert + marker, 1)
              delegate = '    override fun selectAudio(id: Int) = p.selectAudio(id)'
              delegate_insert = '''    override fun audioMixEnable(url: String, headers: String?) = p.audioMixEnable(url, headers)
    override fun audioMixDisable() = p.audioMixDisable()
    override val audioMixEnabled get() = MutableStateFlow(p.audioMixIsEnabled())
'''
              s = s.replace(delegate, delegate_insert + delegate, 1)
          p.write_text(s)
      - name: Verify
        run: grep -n "audioMixEnable\|audioMixDisable\|audioMixExternalAid" player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt .github/workflows/audiomix-core-patch.yml
          git commit -m "Apply AudioMix Core Patch"
          git rm .github/workflows/audiomix-core-patch.yml
          git commit -m "Remove one-time AudioMix patch workflow"
          git push
